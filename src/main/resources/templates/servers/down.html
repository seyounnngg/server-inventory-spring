<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>DOWN 서버 - 서버 인벤토리</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav><a th:href="@{/servers}">← 목록으로</a></nav>

<h1>DOWN 상태 서버</h1>

<p th:if="${#lists.isEmpty(servers)}">현재 DOWN으로 확인된 서버가 없습니다.</p>

<table th:unless="${#lists.isEmpty(servers)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>호스트명</th>
        <th>IP</th>
        <th>담당자</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="server : ${servers}">
        <td th:text="${server.id}"></td>
        <td><a th:href="@{/servers/{id}(id=${server.id})}" th:text="${server.hostname}"></a></td>
        <td th:text="${server.ipAddress}"></td>
        <td th:text="${server.owner != null ? server.owner.name : '-'}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
