<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>DOWN 서버 - 서버 인벤토리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<div class="container">
    <h1 class="h3 mb-3">DOWN 상태 서버</h1>

    <div class="alert alert-success" th:if="${#lists.isEmpty(servers)}">현재 DOWN으로 확인된 서버가 없습니다.</div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(servers)}">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>호스트명</th>
                <th>IP</th>
                <th>담당자</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="server : ${servers}">
                <td th:text="${server.id}"></td>
                <td><a th:href="@{/servers/{id}(id=${server.id})}" th:text="${server.hostname}"></a></td>
                <td th:text="${server.ipAddress}"></td>
                <td th:text="${server.owner != null ? server.owner.name : '-'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
