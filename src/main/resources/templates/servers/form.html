<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${serverId} != null ? '서버 수정' : '서버 등록'"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<div class="container" style="max-width: 560px;">
    <h1 class="h3 mb-3" th:text="${serverId} != null ? '서버 수정' : '서버 등록'"></h1>

    <form method="post"
          th:action="${serverId} != null ? @{/servers/{id}(id=${serverId})} : @{/servers}"
          th:object="${serverForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="_method" value="put" th:if="${serverId} != null"/>

        <div class="mb-3">
            <label class="form-label">호스트명</label>
            <input class="form-control" type="text" th:field="*{hostname}"
                   th:classappend="${#fields.hasErrors('hostname')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('hostname')}" th:errors="*{hostname}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">IP 주소</label>
            <input class="form-control" type="text" th:field="*{ipAddress}" placeholder="192.168.0.10"
                   th:classappend="${#fields.hasErrors('ipAddress')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('ipAddress')}" th:errors="*{ipAddress}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">포트</label>
            <input class="form-control" type="number" th:field="*{port}" min="1" max="65535"
                   th:classappend="${#fields.hasErrors('port')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('port')}" th:errors="*{port}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">상태</label>
            <select class="form-select" th:field="*{status}"
                    th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                <option th:each="s : ${T(com.example.serverinventory.domain.ServerStatus).values()}"
                        th:value="${s}" th:text="${s}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
        </div>
        <button class="btn btn-primary" type="submit">저장</button>
    </form>
</div>
</body>
</html>
