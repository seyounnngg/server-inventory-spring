<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>서버 목록 - 서버 인벤토리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">서버 목록</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/servers/down}">DOWN 서버만 보기</a>
            <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/servers/check-all}" class="mb-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-primary">전체 서버 일괄 점검</button>
            </form>
            <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary" th:href="@{/servers/new}">+ 서버 등록</a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>호스트명</th>
                <th>IP</th>
                <th>포트</th>
                <th>상태</th>
                <th>담당자</th>
                <th>마지막 점검</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="server : ${servers}">
                <td th:text="${server.id}"></td>
                <td><a th:href="@{/servers/{id}(id=${server.id})}" th:text="${server.hostname}"></a></td>
                <td th:text="${server.ipAddress}"></td>
                <td th:text="${server.port}"></td>
                <td><span th:class="'badge status-' + ${server.status}" th:text="${server.status}"></span></td>
                <td th:text="${server.owner != null ? server.owner.name : '-'}"></td>
                <td>
                    <span th:with="check=${latestChecks.get(server.id)}"
                          th:if="${check != null}"
                          th:class="'badge check-' + ${check.result}"
                          th:text="${check.result}"></span>
                    <span th:if="${latestChecks.get(server.id) == null}">-</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${page.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/servers(page=${page.number - 1})}">← 이전</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/servers(page=${page.number + 1})}">다음 →</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
