<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <title>서버 목록 - 서버 인벤토리</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav>
    <span sec:authentication="name">username</span>님 환영합니다
    (<span sec:authorize="hasRole('ADMIN')">ADMIN</span><span sec:authorize="!hasRole('ADMIN')">VIEWER</span>)
    <a th:href="@{/api/servers}">API</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">사용자 관리</a>
    <form method="post" th:action="@{/logout}" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">로그아웃</button>
    </form>
</nav>

<h1>서버 목록</h1>

<div class="flash" th:if="${message}" th:text="${message}"></div>

<p>
    <a th:href="@{/servers/down}">DOWN 서버만 보기</a>
    <span sec:authorize="hasRole('ADMIN')"> | <a th:href="@{/servers/new}">+ 서버 등록</a></span>
</p>

<form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/servers/check-all}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit">전체 서버 일괄 점검</button>
</form>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>호스트명</th>
        <th>IP</th>
        <th>포트</th>
        <th>상태</th>
        <th>담당자</th>
        <th>마지막 점검</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="server : ${servers}">
        <td th:text="${server.id}"></td>
        <td><a th:href="@{/servers/{id}(id=${server.id})}" th:text="${server.hostname}"></a></td>
        <td th:text="${server.ipAddress}"></td>
        <td th:text="${server.port}"></td>
        <td><span th:class="'status-' + ${server.status}" th:text="${server.status}"></span></td>
        <td th:text="${server.owner != null ? server.owner.name : '-'}"></td>
        <td>
            <span th:with="check=${latestChecks.get(server.id)}"
                  th:if="${check != null}"
                  th:class="'check-' + ${check.result}"
                  th:text="${check.result}"></span>
            <span th:if="${latestChecks.get(server.id) == null}">-</span>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
