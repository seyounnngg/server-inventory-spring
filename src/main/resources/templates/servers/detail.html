<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${server.hostname} + ' - 서버 인벤토리'"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<div class="container">
    <h1 class="h3 mb-3" th:text="${server.hostname}"></h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <table class="table table-borderless mb-0">
                <tr><th class="w-25">IP 주소</th><td th:text="${server.ipAddress}"></td></tr>
                <tr><th>포트</th><td th:text="${server.port} ?: '-'"></td></tr>
                <tr><th>상태</th><td><span th:class="'badge status-' + ${server.status}" th:text="${server.status}"></span></td></tr>
                <tr><th>담당자</th><td th:text="${server.owner != null ? server.owner.name : '-'}"></td></tr>
                <tr><th>등록일</th><td th:text="${server.createdAt}"></td></tr>
                <tr><th>수정일</th><td th:text="${server.updatedAt}"></td></tr>
                <tr>
                    <th>스펙시트</th>
                    <td>
                        <span th:if="${server.specSheetPath == null}" class="text-muted">첨부된 파일 없음</span>
                        <a th:if="${server.specSheetPath != null}" th:href="@{/servers/{id}/spec-sheet(id=${server.id})}">다운로드</a>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <div class="card mb-4" sec:authorize="hasRole('ADMIN')">
        <div class="card-body">
            <h2 class="h5">관리</h2>
            <div class="d-flex flex-wrap gap-2 align-items-start">
                <a class="btn btn-outline-secondary" th:href="@{/servers/{id}/edit(id=${server.id})}">수정</a>

                <form method="post" th:action="@{/servers/{id}/check(id=${server.id})}" class="mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-outline-primary">지금 점검</button>
                </form>

                <form method="post" th:action="@{/servers/{id}/spec-sheet(id=${server.id})}"
                      enctype="multipart/form-data" class="d-flex gap-2 mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input class="form-control form-control-sm" type="file" name="file"/>
                    <button type="submit" class="btn btn-outline-secondary text-nowrap">업로드</button>
                </form>

                <form method="post" th:action="@{/servers/{id}(id=${server.id})}"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');" class="mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit" class="btn btn-outline-danger">삭제</button>
                </form>
            </div>
        </div>
    </div>

    <h2 class="h5">점검 이력</h2>
    <p class="text-muted" th:if="${#lists.isEmpty(checks)}">아직 점검 기록이 없습니다.</p>
    <div class="table-responsive mb-4" th:unless="${#lists.isEmpty(checks)}">
        <table class="table table-sm">
            <thead class="table-light"><tr><th>점검 시각</th><th>결과</th></tr></thead>
            <tbody>
            <tr th:each="check : ${checks}">
                <td th:text="${check.checkedAt}"></td>
                <td><span th:class="'badge check-' + ${check.result}" th:text="${check.result}"></span></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div sec:authorize="hasRole('ADMIN')">
        <h2 class="h5">변경 이력</h2>
        <p class="text-muted" th:if="${#lists.isEmpty(auditLogs)}">변경 이력이 없습니다.</p>
        <div class="table-responsive mb-4" th:unless="${#lists.isEmpty(auditLogs)}">
            <table class="table table-sm">
                <thead class="table-light"><tr><th>일시</th><th>작업자</th><th>구분</th><th>내용</th></tr></thead>
                <tbody>
                <tr th:each="log : ${auditLogs}">
                    <td th:text="${log.changedAt}"></td>
                    <td th:text="${log.actorUsername}"></td>
                    <td th:text="${log.action}"></td>
                    <td th:text="${log.detail}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
