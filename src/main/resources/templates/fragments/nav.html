<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/servers}">서버 인벤토리</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/servers}">서버 목록</a>
            <a class="nav-link" th:href="@{/servers/down}">DOWN 서버</a>
            <a class="nav-link" th:href="@{/api/servers}">API</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">사용자 관리</a>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="navbar-text text-light">
                <span sec:authentication="name">username</span>
                <span class="badge bg-primary" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="badge bg-secondary" sec:authorize="!hasRole('ADMIN')">VIEWER</span>
            </span>
            <form method="post" th:action="@{/logout}" class="mb-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-light btn-sm">로그아웃</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
