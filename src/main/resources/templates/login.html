<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>로그인 - 서버 인벤토리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4">
            <h1 class="h4 mb-3 text-center">서버 인벤토리 로그인</h1>

            <div class="alert alert-danger" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
            <div class="alert alert-info" th:if="${param.logout}">로그아웃되었습니다.</div>
            <div class="alert alert-success" th:if="${param.signup}">회원가입이 완료되었습니다. 로그인해주세요.</div>

            <form method="post" th:action="@{/login}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">아이디</label>
                    <input class="form-control" name="username" type="text"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">비밀번호</label>
                    <input class="form-control" name="password" type="password"/>
                </div>
                <button class="btn btn-primary w-100" type="submit">로그인</button>
            </form>

            <p class="text-center mt-3 mb-0">
                계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
