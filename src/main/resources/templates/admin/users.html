<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>사용자 관리 - 서버 인벤토리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<div class="container">
    <h1 class="h3 mb-3">사용자 관리</h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>아이디</th>
                <th>이름</th>
                <th>권한</th>
                <th>변경</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.role}"></td>
                <td>
                    <form method="post" th:action="@{/admin/users/{id}/role(id=${user.id})}"
                          class="d-flex gap-2 mb-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <select name="role" class="form-select form-select-sm" style="width: auto;">
                            <option value="VIEWER" th:selected="${user.role.name() == 'VIEWER'}">VIEWER</option>
                            <option value="ADMIN" th:selected="${user.role.name() == 'ADMIN'}">ADMIN</option>
                        </select>
                        <button type="submit" class="btn btn-outline-secondary btn-sm">변경</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
