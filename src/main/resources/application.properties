spring.application.name=server-inventory-spring

# 개발용 H2 인메모리 DB (기본 프로필)
spring.datasource.url=jdbc:h2:mem:serverinventory;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.mvc.hiddenmethod.filter.enabled=true

storage.location=upload-dir

# 상시 자동 핑 점검 (기본 5분 간격). 즉시 확인이 필요하면 화면의 "지금 점검"/"전체 서버 일괄 점검" 버튼을 쓴다.
monitoring.ping.enabled=true
monitoring.ping.fixed-delay-ms=300000
monitoring.ping.initial-delay-ms=30000
